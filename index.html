<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>木吉他每日練習選單</title>
<!-- 引入截圖功能必備的 html2canvas 程式庫 -->
<script src="https://cloudflare.com"></script>
<style>
:root {
  --ink:#292d32;
  --muted:#707782;
  --paper:#f5f3ee;
  --card:#ffffff;
  --accent:#527665;
  --line:#e5e2da;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;
  line-height:1.65;
}
header {
  background:#303d37;
  color:white;
  padding:32px 20px 25px;
}
.wrap { max-width:850px; margin:auto; padding:20px; }
header .wrap { padding:0 20px; }
.eyebrow { font-size:12px; letter-spacing:3px; opacity:.75; }
h1 { font-size:clamp(25px,5vw,36px); margin:8px 0; }
.subtitle { color:#e0e8e2; font-size:14px; }
.tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
button {
  font:inherit; cursor:pointer; border:0; border-radius:10px;
  padding:10px 15px;
}
.tab { background:#e6e4dd; color:var(--ink); }
.tab.active { background:var(--accent); color:white; }
.card {
  background:var(--card); border:1px solid var(--line);
  border-radius:16px; padding:20px; margin-bottom:16px;
}
h2 { font-size:21px; margin:0 0 5px; }
h3 { font-size:16px; margin:0 0 5px; }
.muted { color:var(--muted); font-size:13px; }
.item {
  display:flex; gap:12px; align-items:flex-start;
  padding:13px 0; border-bottom:1px solid var(--line);
  cursor:pointer;
}
.item:last-child { border-bottom:0; }
.item input { width:19px; height:19px; margin-top:5px; accent-color:var(--accent); }
.item-main { flex:1; min-width:0; }
.item-title { font-weight:650; }
.detail { font-size:13px; color:var(--muted); margin-top:3px; }
.time {
  white-space:nowrap; font-size:12px; font-weight:700;
  background:#f0eee8; padding:4px 8px; border-radius:7px;
}
.pill {
  display:inline-block; background:#e7eee8; color:#355d49;
  border-radius:20px; padding:3px 9px; font-size:12px;
}
.progress-bg { height:9px; background:#e9e7e0; border-radius:9px; overflow:hidden; margin:12px 0; }
.progress { height:100%; background:var(--accent); width:0%; transition:width .2s; }
.stats { display:flex; justify-content:space-between; gap:10px; font-size:13px; }
.big { font-size:30px; font-weight:750; }
.xp { color:var(--accent); font-weight:750; white-space:nowrap; }
.actions { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0; }
.primary { background:var(--accent); color:white; }
.secondary { background:#e6e4dd; color:var(--ink); }
.panel[hidden] { display:none; }
.tip { background:#f1f4ef; padding:13px 15px; border-radius:10px; font-size:13px; }
footer { text-align:center; color:var(--muted); font-size:12px; padding:12px 0 30px; }
@media(max-width:480px) {
  .wrap { padding:14px; }
  .card { padding:16px; }
  .time { font-size:11px; padding:3px 6px; }
}
</style>
</head>
<body>
<div id="captureArea"> <!-- 包裹整個需要截圖的區域 -->
<header>
  <div class="wrap">
    <div class="eyebrow">GUITAR DAILY PRACTICE</div>
    <h1>木吉他每日練習選單</h1>
    <div class="subtitle">每天進步一點點，讓練習成為習慣。</div>
  </div>
</header>

<main class="wrap">
  <nav class="tabs no-print" aria-label="練習模式">
    <button class="tab active" data-tab="standard">入門版・30 分鐘</button>
    <button class="tab" data-tab="advanced">進階版・60 分鐘</button>
    <button class="tab" data-tab="daily">每日任務卡・XP</button>
  </nav>

  <section class="card">
    <div class="stats">
      <span>今日完成進度</span>
      <strong id="progressText">0 / 5 項</strong>
    </div>
    <div class="progress-bg"><div class="progress" id="progressBar"></div></div>
    <div class="stats">
      <span class="muted" id="progressHint">開始今天的練習吧！</span>
      <span class="pill" id="modeLabel">入門練習</span>
    </div>
  </section>

  <section class="panel" id="standard">
    <div class="card">
      <h2>入門版｜30 分鐘</h2>
      <p class="muted">適合初學者、日常維持基本手感的基礎練習。</p>
      <div id="standardList"></div>
    </div>
  </section>

  <section class="panel" id="advanced" hidden>
    <div class="card">
      <h2>進階版｜60 分鐘</h2>
      <p class="muted">適合已有基礎，希望全面加強技巧、節奏與完整度的人。</p>
      <div id="advancedList"></div>
    </div>
  </section>

  <section class="panel" id="daily" hidden>
    <div class="card">
      <h2>每日任務卡</h2>
      <p class="muted">完成任務累積今天的 XP 經驗值。</p>
      <div class="stats">
        <span>今日累積 XP</span>
        <span><span class="big" id="xpTotal">0</span> XP</span>
      </div>
      <div class="progress-bg"><div class="progress" id="xpBar"></div></div>
      <div class="stats">
        <span id="xpProgress">完成 0 / 5 項</span>
        <span id="xpPercent">0%</span>
      </div>
      <div id="dailyList"></div>
    </div>
    <div class="card">
      <h3>今日練習紀錄</h3>
      <textarea id="reflection" rows="4" style="width:100%;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit" placeholder="今天最順的地方、遇到的問題或明天的目標..."></textarea>
    </div>
  </section>

  <div class="actions no-print">
    <button class="primary" onclick="captureScreen()">截圖該網頁畫面</button>
    <button class="secondary" onclick="resetCurrent()">重設目前勾選</button>
    <button class="secondary" onclick="resetAll()">全部重設</button>
  </div>

  <div class="tip">
    <strong>老師的小提醒</strong><br>
    1. 練習前先調音。 2. 從慢速開始，確定節奏穩定後再增加 BPM。 3. 手部不適請立即休息。
  </div>
</main>
<footer>GUITAR PRACTICE PLAN</footer>
</div> <!-- 截圖包裹區域結束 -->
<script>
const plans = {
  standard: [
    ["暖身與調音","調整坐姿、放鬆雙手，確認六弦標準音準。",5],
    ["左手基本功","練習 1-2-3-4 爬格子，注意每個音清楚乾淨。",5],
    ["右手技巧與節奏","練習分解和弦、基礎刷弦或節拍器拍擊。",5],
    ["和弦與轉換","練習 C、G、Am、F 等常用和弦慢速反覆轉換。",5],
    ["歌曲分段練習","選一首目前學的歌，專攻最容易出錯的小節。",10]
  ],
  advanced: [
    ["暖身與基本功","確認音準、手部放鬆，練習爬格子與勾擊弦技巧。",5],
    ["左手與橫按技巧","專項訓練大橫按把位轉換，消除雜音。",10],
    ["右手技巧與切分音","配合節拍器，練習切分音、切音與複雜刷弦節奏。",10],
    ["音階與伴奏型","練習大小調音階，嘗試不同的琶音力度控制。",10],
    ["歌曲專項拆解","針對困難演奏片段逐小節分段拆解，由慢到快。",15],
    ["完整演奏錄音","不中斷完整彈奏全曲並錄音，記錄需改善之處。",10]
  ],
  daily: [
    ["基本技巧","完成 10 分鐘基本功爬格子訓練。",10],
    ["節奏訓練","完成節拍器配合或刷弦節奏練習。",15],
    ["和弦轉換","完成特定困難和弦的無縫切換練習。",15],
    ["旋律指法","完成一段旋律、音階或solo指法訓練。",10],
    ["歌曲錄音","完成今天設定的歌曲目標並錄製成果。",20]
  ]
};

let current = "standard";

// 渲染清單項目 (完全修復陣列解構錯誤，完美抓取子項目)
function makeItems(id, items, isDaily=false) {
  const root = document.getElementById(id);
  root.innerHTML = "";
  items.forEach((item, i) => {
    const el = document.createElement("label");
    el.className = "item";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.dataset.group = id;
    checkbox.dataset.index = i;
    checkbox.addEventListener("change", updateProgress);

    const main = document.createElement("div");
    main.className = "item-main";
    const title = document.createElement("div");
    title.className = "item-title";
    title.textContent = item[0]; // 已修復：抓取陣列第 0 項（名稱）
    const detail = document.createElement("div");
    detail.className = "detail";
    detail.textContent = item[1]; // 已修復：抓取陣列第 1 項（描述）
    main.append(title, detail);

    const badge = document.createElement("span");
    badge.className = isDaily ? "xp" : "time";
    badge.textContent = isDaily ? "+" + item[2] + " XP" : item[2] + " 分鐘"; // 已修復：抓取陣列第 2 項（數值）
    el.append(checkbox, main, badge);
    root.appendChild(el);
  });
}

// 更新進度條與狀態計算
function updateProgress() {
  const listId = current === "standard" ? "standardList" : current === "advanced" ? "advancedList" : "dailyList";
  const boxes = [...document.querySelectorAll(`#${listId} input[type="checkbox"]`)];
  const done = boxes.filter(b => b.checked).length;
  const total = boxes.length;
  const percent = total ? Math.round((done / total) * 100) : 0;
  
  document.getElementById("progressText").textContent = `${done} / ${total} 項`;
  document.getElementById("progressBar").style.width = percent + "%";
  document.getElementById("progressHint").textContent = percent === 100 ? "太棒了！今天的練習已完成。" : percent >= 50 ? "做得很好，繼續保持！" : "開始今天的練習吧！";

  if (current === "daily") {
    const dailyBoxes = [...document.querySelectorAll("#dailyList input")];
    const dailyDone = dailyBoxes.filter(b => b.checked);
    const xp = dailyDone.reduce((sum, b) => sum + plans.daily[Number(b.dataset.index)][2], 0);
    document.getElementById("xpTotal").textContent = xp;
    document.getElementById("xpBar").style.width = (xp / 70 * 100) + "%";
    document.getElementById("xpProgress").textContent = `完成 ${dailyDone.length} / ${plans.daily.length} 項`;
    document.getElementById("xpPercent").textContent = Math.round((xp / 70) * 100) + "%";
  }
  saveData();
}

// 分頁切換功能
document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    current = btn.dataset.tab;
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".panel").forEach(p => p.hidden = p.id !== current);
    document.getElementById("modeLabel").textContent = current === "standard" ? "入門練習" : current === "advanced" ? "進階練習" : "每日 XP 任務";
    updateProgress();
  });
});

function resetCurrent() {
  const listId = current === "standard" ? "standardList" : current === "advanced" ? "advancedList" : "dailyList";
  document.querySelectorAll(`#${listId} input`).forEach(b => b.checked = false);
  updateProgress();
}

function resetAll() {
  document.querySelectorAll('input[type="checkbox"]').forEach(b => b.checked = false);
  document.getElementById("reflection").value = "";
  updateProgress();
}

// 本地儲存功能 (LocalStorage)
function saveData() {
  const data = {};
  document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    data[`${cb.dataset.group}-${cb.dataset.index}`] = cb.checked;
  });
  data.reflection = document.getElementById("reflection").value;
  localStorage.setItem("guitarPracticeData", JSON.stringify(data));
}

function loadData() {
  const dataStr = localStorage.getItem("guitarPracticeData");
  if (!dataStr) return;
  const data = JSON.parse(dataStr);
  
  document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    const key = `${cb.dataset.group}-${cb.dataset.index}`;
    if (data[key] !== undefined) cb.checked = data[key];
  });
  if (data.reflection !== undefined) {
    document.getElementById("reflection").value = data.reflection;
  }
}

// 實作網頁畫面截圖導出功能
function captureScreen() {
  const area = document.getElementById("captureArea");
  const noPrintElements = document.querySelectorAll('.no-print');
  noPrintElements.forEach(el => el.style.display = 'none');
  
  html2canvas(area, {
    useCORS: true,
    scale: 2,
    backgroundColor: "#f5f3ee"
  }).then(canvas => {
    noPrintElements.forEach(el => el.style.display = '');
    const link = document.createElement("a");
    link.download = "吉他每日練習進度.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  }).catch(err => {
    noPrintElements.forEach(el => el.style.display = '');
    alert("截圖失敗，請直接使用手機內建功能鍵截圖。");
  });
}

document.getElementById("reflection").addEventListener("input", saveData);

// 初始化網頁渲染與載入
makeItems("standardList", plans.standard);
makeItems("advancedList", plans.advanced);
makeItems("dailyList", plans.daily, true);
loadData();
updateProgress();
</script>
</body>
</html>
